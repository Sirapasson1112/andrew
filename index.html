<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารจัดการงานซ่อมบำรุงเชิงป้องกัน (PM-CMMS Pro Connected Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: #f8fafc; color: #0f172a; }
        .sarabun-font { font-family: 'Sarabun', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .a4-sheet {
            width: 210mm; min-height: 297mm; padding: 12mm 15mm; margin: 0 auto; background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box;
        }
        #routePlanMap, #fieldRouteMap { width: 100%; height: 350px; border-radius: 1rem; z-index: 5; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #000000; padding: 3px 5px; font-size: 10px; color: #000000; }
        th { background-color: #f1f5f9; font-weight: 600; text-align: center; }
        input[type="text"], input[type="date"], select { border: none; outline: none; background: transparent; width: 100%; font-family: 'Sarabun', sans-serif; font-size: 10px; color: #000000; }
        .form-header-bg { background-color: #d1d5db; font-weight: bold; color: #000; }
        .sub-header-bg { background-color: #f3f4f6; font-weight: bold; color: #000; }
        @media print {
            body { background: white !important; }
            aside, header, .no-print { display: none !important; }
            .a4-sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 8mm !important; border: none !important; }
        }
    </style>
</head>
<body class="h-full flex flex-col antialiased overflow-hidden">

    <!-- Toast & Offline Status Bar -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>
    <div id="offline-banner" class="bg-amber-500 text-slate-950 px-4 py-1.5 text-xs font-semibold text-center hidden no-print flex items-center justify-center space-x-3 shadow-md">
        <i data-lucide="wifi-off" class="w-4 h-4"></i>
        <span>โหมด Offline: ข้อมูลถูกเก็บไว้ในเครื่องและจะ Sync อัตโนมัติเมื่อมีอินเทอร์เน็ต (<span id="offline-count">0</span> รายการ)</span>
        <button onclick="manualSync()" class="underline ml-2 bg-amber-700 text-white px-2.5 py-1 rounded text-xs cursor-pointer">ซิงค์ทันที</button>
    </div>

    <div class="flex h-full w-full overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-64 bg-slate-900 text-slate-200 flex flex-col transition-all duration-300 z-30 shrink-0 md:relative absolute inset-y-0 left-0 -translate-x-full md:translate-x-0 shadow-xl no-print">
            <div class="p-5 flex items-center justify-between border-b border-slate-800">
                <div class="flex items-center space-x-3">
                    <div class="bg-slate-800 text-white p-2.5 rounded-xl border border-slate-700 shadow-sm">
                        <i data-lucide="zap" class="w-5 h-5 text-amber-400"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base text-white tracking-wide">PM-CMMS Pro</h1>
                        <p class="text-[10px] text-slate-400">Connected Edition</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>

            <nav class="flex-1 px-4 py-5 space-y-1.5 overflow-y-auto custom-scrollbar text-xs">
                <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl font-medium transition-all text-slate-300 hover:bg-slate-800 hover:text-white active-tab bg-slate-800 text-white shadow-xs" data-target="dashboard">
                    <i data-lucide="layout-dashboard" class="w-4 h-4 text-slate-400"></i><span>Dashboard & Analytics</span>
                </button>
                <button onclick="switchTab('pm-schedule')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl font-medium transition-all text-slate-300 hover:bg-slate-800 hover:text-white" data-target="pm-schedule">
                    <i data-lucide="calendar-range" class="w-4 h-4 text-slate-400"></i><span>ตารางวางแผน PM อุปกรณ์ไฟฟ้า</span>
                </button>
                <button onclick="switchTab('route-plan')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl font-medium transition-all text-slate-300 hover:bg-slate-800 hover:text-white" data-target="route-plan">
                    <i data-lucide="map" class="w-4 h-4 text-slate-400"></i><span>วางแผนเส้นทางตรวจอุปกรณ์</span>
                </button>
                <button onclick="switchTab('electrical-form')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl font-medium transition-all text-slate-300 hover:bg-slate-800 hover:text-white" data-target="electrical-form">
                    <i data-lucide="file-text" class="w-4 h-4 text-slate-400"></i><span>ฟอร์มเอกสาร (11 แบบ กฟน.)</span>
                </button>
                <button onclick="switchTab('field-route')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl font-medium transition-all text-slate-300 hover:bg-slate-800 hover:text-white" data-target="field-route">
                    <i data-lucide="navigation" class="w-4 h-4 text-slate-400"></i><span>นำเส้นทางตรวจ & ภาคสนาม</span>
                </button>
                <button onclick="switchTab('wo-analytics')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl font-medium transition-all text-slate-300 hover:bg-slate-800 hover:text-white" data-target="wo-analytics">
                    <i data-lucide="bar-chart-3" class="w-4 h-4 text-slate-400"></i><span>วิเคราะห์ Work Order & Excel</span>
                </button>
                <button onclick="switchTab('admin-settings')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl font-medium transition-all text-slate-300 hover:bg-slate-800 hover:text-white" data-target="admin-settings">
                    <i data-lucide="settings" class="w-4 h-4 text-slate-400"></i><span>จัดการสิทธิ์ & Audit Log</span>
                </button>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-100">
            <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between shrink-0 shadow-xs no-print">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100"><i data-lucide="menu" class="w-6 h-6"></i></button>
                    <h2 id="page-title" class="text-lg font-bold text-slate-900 tracking-tight">Dashboard & Analytics</h2>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="flex items-center space-x-2 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                        <i data-lucide="user-check" class="w-4 h-4 text-slate-600"></i>
                        <select id="userRoleSelect" onchange="changeUserRole(this.value)" class="text-xs font-semibold bg-transparent text-slate-700 outline-none cursor-pointer">
                            <option value="ช่างภาคสนาม">ช่างภาคสนาม (Field Tech)</option>
                            <option value="หัวหน้างาน">หัวหน้างาน (Supervisor)</option>
                            <option value="แอดมิน">ผู้ดูแลระบบ (Admin)</option>
                        </select>
                    </div>
                    <span id="sync-status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center space-x-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1"></span> <span>ออนไลน์</span>
                    </span>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6">
                
                <!-- TAB 1: DASHBOARD -->
                <section id="tab-dashboard" class="tab-content space-y-6">
                    <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex items-center space-x-3">
                            <select id="filterRisk" onchange="applyFilters()" class="px-3.5 py-2 border border-slate-200 rounded-xl text-xs bg-slate-50 text-slate-700"><option value="">ทุกระดับความเสี่ยง</option><option value="ปกติ">ปกติ</option><option value="เฝ้าระวัง">เฝ้าระวัง</option><option value="ต้องซ่อมด่วน">ต้องซ่อมด่วน</option></select>
                            <select id="filterDevice" onchange="applyFilters()" class="px-3.5 py-2 border border-slate-200 rounded-xl text-xs bg-slate-50 text-slate-700"><option value="">ทุกประเภทอุปกรณ์</option><option value="TR">หม้อแปลง (TR)</option><option value="LBS">สวิตช์ (LBS)</option></select>
                        </div>
                        <button onclick="exportReportData()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold flex items-center space-x-2 cursor-pointer shadow-sm">
                            <i data-lucide="download" class="w-4 h-4"></i><span>Export รายงาน (PDF/Excel)</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between"><div><p class="text-xs font-semibold text-slate-500 uppercase">จุดตรวจทั้งหมด</p><h3 id="stat-total" class="text-3xl font-bold text-slate-900 mt-1">12</h3></div><div class="p-3.5 bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="cpu" class="w-6 h-6"></i></div></div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between"><div><p class="text-xs font-semibold text-slate-500 uppercase">ผ่านการตรวจสอบ</p><h3 id="stat-pass" class="text-3xl font-bold text-emerald-600 mt-1">9</h3></div><div class="p-3.5 bg-emerald-50 text-emerald-600 rounded-xl"><i data-lucide="check-circle-2" class="w-6 h-6"></i></div></div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between"><div><p class="text-xs font-semibold text-slate-500 uppercase">พบปัญหา / เฝ้าระวัง</p><h3 id="stat-warning" class="text-3xl font-bold text-amber-600 mt-1">2</h3></div><div class="p-3.5 bg-amber-50 text-amber-600 rounded-xl"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div></div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between"><div><p class="text-xs font-semibold text-slate-500 uppercase">ต้องซ่อมด่วน (Critical)</p><h3 id="stat-critical" class="text-3xl font-bold text-rose-600 mt-1">1</h3></div><div class="p-3.5 bg-rose-50 text-rose-600 rounded-xl"><i data-lucide="shield-alert" class="w-6 h-6"></i></div></div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <div class
